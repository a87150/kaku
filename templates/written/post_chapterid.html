<div id="chapters">
{% for chapter in article.chapter_set.all %}
    <button type="button" class="mdui-btn mdui-btn-raised" >
        {{ chapter.title }}
        <li hidden class="chaptersid">{{ chapter.id }}</li>
    </button>
{% endfor %}
{% if user == article.author %}

    <button type="button" class="mdui-btn mdui-btn-raised" id="addchapter">
    <a href="new/">添加章节</a>
    </button>

{% endif %}
</div>

<script>
    (function () {
        'use strict';
        var buttons = document.querySelectorAll('#chapters button.mdui-btn');
        Array.prototype.forEach.call(buttons, function (btn) {
            btn.addEventListener('click', function () {
                var li = btn.querySelector('.chaptersid');
                if (!li) {
                    return; // “添加章节”按钮等不含章节 id
                }
                var id = li.textContent.trim();
                Array.prototype.forEach.call(buttons, function (b) { b.disabled = false; });
                btn.disabled = true;
                window.KakuAjax.post('/written/chapter/' + id + '/', {id: id}, function (ret) {
                    var content = (ret && ret.content) ? ret.content : '';
                    var contentEl = document.getElementById('content');
                    if (contentEl) {
                        contentEl.innerHTML = content;
                    }
                    // 章节内容已整体替换，重建文章目录
                    if (window.KakuTOC) { window.KakuTOC.rebuild(); }
                });
            });
        });
    })();
</script>
