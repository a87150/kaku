{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}
<title>更换头像 - kaku demo</title>
{% endblock title %}

{% block main %}
<div class="mdui-row">
    <div class="mdui-col-md-8 mdui-col-offset-md-2">
        <div class="mdui-card kaku-card">
            <div class="mdui-card-primary">
                <div class="mdui-card-primary-title">更换头像</div>
                <div class="mdui-card-primary-subtitle kaku-text-muted">支持 JPG / PNG / GIF，不能大于 1MB</div>
            </div>
            <div class="mdui-divider"></div>
            <div class="mdui-card-content">
                <div style="display:flex; align-items:center; margin-bottom: 16px;">
                    <img src="{{ user.mugshot_thumbnail.url }}" class="mdui-img-circle" style="width: 72px; height: 72px; margin-right: 16px;"/>
                    <span class="kaku-text-muted">当前头像</span>
                </div>
                {% crispy form %}
                <div class="kaku-text-muted" style="font-size: 12px; margin-top: 8px;">选择图片后确认上传即可替换头像</div>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        var objfile = document.getElementById('id_mugshot');
        if (!objfile) {
            return;
        }
        objfile.addEventListener('change', function () {
            var file = objfile.files && objfile.files[0];
            if (!file || !objfile.value) {
                alert("请先选择上传文件");
                return;
            }
            if (file.type !== 'image/jpeg' && file.type !== 'image/png' && file.type !== 'image/gif') {
                alert("不是有效的图片文件!");
                objfile.value = '';
                return;
            }
            if (file.size > 1024 * 1024) {
                alert("图片超过1mb");
                objfile.value = '';
                return;
            }
        });
    })();
</script>
{% endblock main %}
