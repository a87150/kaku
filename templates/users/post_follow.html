{% if request.user != user and request.user.is_authenticated %}
    {% if is_follow %}
    <button class="mdui-btn mdui-color-grey-700 mdui-ripple" id="unfollow-btn" userid="{{ user.id }}">取关</button>
    {% else %}
    <button class="mdui-btn mdui-btn-raised mdui-ripple mdui-color-grey-700" id="follow-btn" userid="{{ user.id }}">关注</button>
    {% endif %}
{% endif %}

<script>
    $(document).ready(function () {
        function bindFollow() {
            var followBtn = $('#follow-btn');
            var unfollowBtn = $('#unfollow-btn');
            followBtn.off('click').on('click', function () {
                var $this = $(this);
                var objectId = $this.attr('userid');
                $.post('/follow/create/', {object_id: objectId, ftype: 'follow'}, function (ret) {
                    if (ret && ret.ok) {
                        $this.replaceWith('<button class="mdui-btn mdui-color-grey-700 mdui-ripple" id="unfollow-btn" userid="' + objectId + '">取关</button>');
                        bindFollow();
                    } else {
                        alert(ret && ret.msg ? ret.msg : '操作失败');
                    }
                });
            });
            unfollowBtn.off('click').on('click', function () {
                var $this = $(this);
                var objectId = $this.attr('userid');
                $.post('/follow/create/', {object_id: objectId, ftype: 'unfollow'}, function (ret) {
                    if (ret && ret.ok) {
                        $this.replaceWith('<button class="mdui-btn mdui-btn-raised mdui-ripple mdui-color-grey-700" id="follow-btn" userid="' + objectId + '">关注</button>');
                        bindFollow();
                    } else {
                        alert(ret && ret.msg ? ret.msg : '操作失败');
                    }
                });
            });
        }
        bindFollow();
    });
</script>
