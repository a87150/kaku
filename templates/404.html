{% extends 'base.html' %}

{% block title %}
<title>404 - 页面不存在</title>
{% endblock title %}

{% block main %}
<div class="mdui-row">
    <div class="mdui-col-md-8 mdui-col-offset-md-2">
        <div class="mdui-card kaku-card mdui-text-center" style="padding: 64px 16px;">
            <i class="mdui-icon material-icons" style="font-size: 96px; color: #bdbdbd;">error_outline</i>
            <div class="mdui-typo-display-2">404</div>
            <div class="mdui-typo-title mdui-p-t-1">页面不存在</div>
            <p class="mdui-typo mdui-text-color-grey-600 mdui-p-t-1">你访问的页面可能已被删除或从未存在</p>
            <div class="mdui-p-t-2">
                <a href="/" class="mdui-btn mdui-btn-raised mdui-color-grey-800">返回首页</a>
            </div>
        </div>
    </div>
</div>
{% endblock main %}
