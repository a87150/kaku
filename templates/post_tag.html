{% if request.user.is_authenticated and tags_type %}
<div class="mdui-card kaku-card">
    <div class="mdui-card-content">
        <div class="mdui-textfield" style="display:flex; align-items:center;">
            <input class="mdui-textfield-input" type="text" placeholder="输入标签后回车或点击添加" id="tag_input" style="flex:1; margin-right:8px;"/>
            <button type="button" class="mdui-btn mdui-btn-raised mdui-color-grey-800 mdui-ripple" id="tag_post"
                    data-type="{{ tags_type }}" data-pk="{{ tags_pk }}">添加</button>
        </div>
    </div>
</div>

<script>
    (function () {
        'use strict';
        var input = document.getElementById('tag_input');
        var btn = document.getElementById('tag_post');
        if (!input || !btn) {
            return;
        }

        // tag.html 的 kaku-tags-live.js 负责把标签块就地插进列表
        function live() {
            return window.KakuTagsLive || null;
        }

        function postTag() {
            var tag = input.value.trim();
            if (!tag) {
                if (live()) {
                    live().showMsg('标签不能为空', false);
                } else {
                    alert('标签不能为空');
                }
                return;
            }
            var type = btn.getAttribute('data-type');
            var pk = btn.getAttribute('data-pk');
            if (!type || !pk) {
                return;
            }

            btn.disabled = true;
            window.KakuAjax.post('/tags/', {tag: tag, pk: pk, type: type}, function (ret) {
                btn.disabled = false;
                ret = ret || {};
                if (ret.ok) {
                    input.value = '';
                    if (live()) {
                        live().addTag(ret.tag || tag);
                    } else {
                        // 兜底：理论上详情页都会加载 live 脚本
                        location.reload();
                    }
                } else if (live()) {
                    live().showMsg(ret.msg || '操作失败', false);
                } else {
                    alert(ret.msg || '操作失败');
                }
            }, function () {
                btn.disabled = false;
                if (live()) {
                    live().showMsg('网络异常，请稍后重试', false);
                }
            });
        }

        btn.addEventListener('click', postTag);
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                postTag();
            }
        });
    })();
</script>
{% else %}
    <div class="kaku-text-muted">需要登录才能添加标签</div>
{% endif %}
