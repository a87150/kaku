# Kaku nginx 配置示例（生产部署参考）
# 需与 deploy/README.md 第 6 节对照阅读；路径请按实际环境替换。
upstream kaku_app_server {
  server unix:/django/run/gunicorn.sock fail_timeout=0;
}

server {
    listen   80;
    server_name takanashi.site;

    client_max_body_size 4G;

    access_log /django/logs/nginx-access.log;
    error_log  /django/logs/nginx-error.log;

    # mdui / EasyMDE / Painterro 都是较大的 CSS/JS，gzip 收益明显
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /django/kaku/static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        alias /django/kaku/media/;
        expires 7d;
        access_log off;
        # 用户上传目录不设 immutable：同名文件可能被覆盖
    }

    location / {
        proxy_pass http://kaku_app_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 配合 DJANGO_HTTPS=1 使用：Django 依此判断请求是否已是 https
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# ===== HTTPS（证书就绪后再启用）=====
